<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galaga P2E Bitcoin Node</title>
    <style>
        body {
            background-color: #020202;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            border: 4px solid #00ffff;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
            margin-top: 10px;
        }
        canvas { background: #000; display: block; }
        .hud-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
        }
        #touch-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 440px;
            padding: 15px 20px;
            box-sizing: border-box;
            margin-top: 10px;
        }
        .control-pad { display: flex; gap: 15px; }
        .touch-btn {
            background-color: rgba(0, 255, 255, 0.15);
            color: #00ffff;
            border: 2px solid #00ffff;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .touch-btn:active {
            background-color: rgba(0, 255, 255, 0.5);
            color: #020202;
            box-shadow: 0 0 15px #00ffff;
        }
        #fire-btn { background-color: rgba(255, 0, 0, 0.2); border-color: #ff0000; color: #ff0000; width: 75px; height: 75px; font-size: 16px; }
        #fire-btn:active { background-color: rgba(255, 0, 0, 0.6); color: #ffffff; box-shadow: 0 0 15px #ff0000; }
        .btn-panel { margin-top: 5px; width: 100%; max-width: 440px; padding: 0 20px; box-sizing: border-box; }
        .cashout-btn {
            width: 100%;
            background-color: #00ff00;
            color: #020202;
            border: none;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .cashout-btn:disabled { background-color: #223322; color: #445544; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="hud-overlay">
        <div>SCORE: <span id="ui-score" style="color: #ff00ff;">0.00000000 BTC</span></div>
        <div>SATS: <span id="ui-sats" style="color: #00ff00;">0</span></div>
    </div>
    <canvas id="galagaCanvas" width="440" height="480"></canvas>
</div>

<div id="touch-controls">
    <div class="control-pad">
        <div id="left-btn" class="touch-btn">◀</div>
        <div id="right-btn" class="touch-btn">▶</div>
    </div>
    <div id="fire-btn" class="touch-btn">FIRE</div>
</div>

<div class="btn-panel">
    <button id="withdraw-btn" class="cashout-btn" onclick="triggerWithdrawal()" disabled>CASH OUT VIA LIGHTNING</button>
</div>

<!-- LINK TO SEPARATE JAVASCRIPT FILE -->
<script src="script.js"></script>
</body>
</html>
